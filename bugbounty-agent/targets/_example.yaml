#     nuclei_concurrency: 10
#     subdomains_per_run: 100
#   nuclei:
#     severity_filter: "low,medium,high,critical"  # ignore info-level noise here
#
# diffing:
#   ignore_subdomain_keywords: ["ci-", "-pr-", "preview-", "staging-"]
#
# jsdiff:
#   enabled: false        # disable JS diffing for this target
